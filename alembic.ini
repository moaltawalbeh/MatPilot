[alembic]
script_location = alembic
prepend_sys_path = .
# URL used only when DATABASE_URL is not set. For async drivers use
# postgresql+asyncpg://; env.py will pass it through to an async engine.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/matpilot

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
